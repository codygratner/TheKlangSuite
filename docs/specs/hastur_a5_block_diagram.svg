<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1414 1000" width="100%" height="100%">
  <defs>
    <!-- Solid Audio Arrowhead (Pitch Black) -->
    <marker id="arrow-audio" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 z" fill="#0F172A" />
    </marker>
    <!-- Modulation Arrowhead: Purple (Stepped Mod) -->
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 z" fill="#7C3AED" />
    </marker>
    <!-- Modulation Arrowhead: Green (Vortex Env) -->
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 z" fill="#059669" />
    </marker>
    <!-- Modulation Arrowhead: Crimson (CodyBass Env) -->
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Sheet Background (Matte White Card Stock) -->
  <rect width="1414" height="1000" fill="#F8FAFC" />
  <rect x="16" y="16" width="1382" height="968" rx="16" fill="none" stroke="#CBD5E1" stroke-width="2.5" />

  <!-- ====================================================================== -->
  <!-- HEADER & SIGNAL BUS LEGEND                                             -->
  <!-- ====================================================================== -->
  <g id="header">
    <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0F172A" letter-spacing="-1">HASTUR</text>
    <rect x="440" y="42" width="220" height="44" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5" />
    <text x="550" y="73" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#991B1B" text-anchor="middle">DUAL-IR3R05 VCF</text>
    <text x="685" y="73" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#64748B">SIGNAL FLOW &amp; MODULATION ARCHITECTURE</text>

    <!-- Legend -->
    <line x1="1020" y1="68" x2="1065" y2="68" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <text x="1075" y="76" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">AUDIO</text>
    <line x1="1175" y1="68" x2="1220" y2="68" stroke="#7C3AED" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round" />
    <text x="1230" y="76" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#7C3AED">MODULATION</text>
  </g>

  <!-- ====================================================================== -->
  <!-- ROW 1: PRIMARY AUDIO PIPELINE (LEFT -> RIGHT)                          -->
  <!-- ====================================================================== -->

  <!-- COLUMN 1: OSCILLATORS & SOURCES (X = 50..330) -->
  <g id="col1-sources">
    <!-- DCO Core Card -->
    <rect x="50" y="140" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" />
    <text x="70" y="186" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#1E3A8A">DCO CORE</text>
    <text x="70" y="234" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#2563EB">14 WAVES + APF</text>

    <!-- Sub-Stator Card -->
    <rect x="50" y="285" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="4" />
    <text x="70" y="331" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#9A3412">SUB-STATOR</text>
    <text x="70" y="379" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#EA580C">PLL SUB OSC</text>

    <!-- S&H Noise Card -->
    <rect x="50" y="430" width="280" height="110" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="4" />
    <text x="70" y="475" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#334155">S&amp;H NOISE</text>
    <text x="70" y="517" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#64748B">CLOCK NOISE</text>
  </g>

  <!-- COLUMN 1 -> COLUMN 2 AUDIO SUMMING TRUNK -->
  <g id="sources-to-mixer">
    <line x1="330" y1="200" x2="370" y2="200" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <line x1="330" y1="345" x2="370" y2="345" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <line x1="330" y1="485" x2="370" y2="485" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <!-- Vertical Summing Bar -->
    <line x1="370" y1="200" x2="370" y2="485" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <!-- Inflow to Mixer -->
    <line x1="370" y1="345" x2="406" y2="345" stroke="#0F172A" stroke-width="8" marker-end="url(#arrow-audio)" />
  </g>

  <!-- COLUMN 2: STEM MIXER & X-MOD (X = 410..670) -->
  <g id="col2-mixer">
    <rect x="410" y="160" width="260" height="380" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="4" />
    <text x="430" y="215" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#92400E">STEM MIXER</text>
    <text x="430" y="265" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#451A03">• 3-CH FADERS</text>
    <text x="430" y="305" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#B45309">• SEETHE DRIVE</text>

    <line x1="430" y1="340" x2="650" y2="340" stroke="#FDE68A" stroke-width="3" />

    <text x="430" y="390" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#92400E">X-MOD ENGINE</text>
    <text x="430" y="440" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#78350F">• CORE FM DEPTH</text>
    <text x="430" y="480" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#78350F">• CORE AM DEPTH</text>
    <text x="430" y="515" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#D97706">CROSS-MOD BUS</text>
  </g>

  <!-- COLUMN 2 -> COLUMN 3 AUDIO TRUNK -->
  <line x1="670" y1="340" x2="726" y2="340" stroke="#0F172A" stroke-width="8" marker-end="url(#arrow-audio)" />

  <!-- COLUMN 3: DUAL IR3R05 VCF (X = 730..1030) -->
  <g id="col3-filter">
    <rect x="730" y="160" width="300" height="380" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="4" />
    <text x="750" y="215" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#065F46">DUAL IR3R05</text>
    <text x="750" y="255" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#047857">24dB CASCADED VCF</text>

    <!-- Topology Badge -->
    <rect x="750" y="275" width="260" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5" />
    <text x="880" y="306" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#065F46" text-anchor="middle">PRE / DUAL / POST</text>

    <text x="750" y="365" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#064E3B">• CUTOFF WARP</text>
    <text x="750" y="410" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#064E3B">• BIPOLAR BITE</text>
    <text x="750" y="455" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#064E3B">• LASER COMB</text>
    <text x="750" y="495" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#047857">• STEREO ORBIT 3D</text>
  </g>

  <!-- COLUMN 3 -> COLUMN 4 AUDIO TRUNK -->
  <line x1="1030" y1="340" x2="1086" y2="340" stroke="#0F172A" stroke-width="8" marker-end="url(#arrow-audio)" />

  <!-- COLUMN 4: DYNAMICS & OUTPUT (X = 1090..1360) -->
  <g id="col4-dynamics-master">
    <!-- Vactrol LPG Card -->
    <rect x="1090" y="160" width="270" height="180" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="4" />
    <text x="1110" y="210" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#991B1B">VACTROL LPG</text>
    <text x="1110" y="252" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#B91C1C">OPTO-GATE MODEL</text>
    <rect x="1110" y="275" width="230" height="44" rx="8" fill="#FEF2F2" stroke="#F87171" stroke-width="2.5" />
    <text x="1225" y="306" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#991B1B" text-anchor="middle">SYNTH / CYBORG / ORG</text>

    <!-- Inter-card Audio Pipe -->
    <line x1="1225" y1="340" x2="1225" y2="376" stroke="#0F172A" stroke-width="8" marker-end="url(#arrow-audio)" />

    <!-- Master & Out Card -->
    <rect x="1090" y="380" width="270" height="160" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
    <text x="1110" y="425" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#0F172A">MASTER OUT</text>
    <text x="1110" y="465" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#334155">• ALPHA CHORUS</text>
    <text x="1110" y="500" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#334155">• GLOBAL WIDTH</text>
    <text x="1110" y="530" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#64748B">• MASTER VOLUME</text>

    <!-- Final Stereo Output -->
    <line x1="1360" y1="460" x2="1396" y2="460" stroke="#0F172A" stroke-width="8" marker-end="url(#arrow-audio)" />
    <text x="1350" y="435" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#0F172A">STEREO</text>
  </g>

  <!-- ====================================================================== -->
  <!-- ROW 2: MODULATION HIGHWAY (STRICTLY VERTICAL FEEDS FROM BELOW)         -->
  <!-- ====================================================================== -->

  <!-- MOD CARD 1: STEPPED RANDOM MODULATION MATRIX (X = 50..670) -->
  <g id="mod-stepped-matrix">
    <rect x="50" y="620" width="620" height="330" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4" />
    <text x="75" y="670" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#5B21B6">STEPPED MODULATION MATRIX</text>
    <text x="75" y="705" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#6D28D9">3x3 CARTESIAN RANDOM STEPPED ROUTING</text>

    <!-- Row 1: Core Target Box -->
    <rect x="75" y="725" width="570" height="58" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2.5" />
    <text x="95" y="763" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#4C1D95">DCO CORE:</text>
    <text x="245" y="763" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#5B21B6">CORE WARP · CORE BITE · RAW STRANGLE</text>

    <!-- Row 2: Sub Target Box -->
    <rect x="75" y="795" width="570" height="58" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2.5" />
    <text x="95" y="833" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#9A3412">SUB-STATOR:</text>
    <text x="270" y="833" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#C2410C">SUB CHEW · SUB SPIT</text>

    <!-- Row 3: Filter Target Box -->
    <rect x="75" y="865" width="570" height="58" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2.5" />
    <text x="95" y="903" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#065F46">DUAL VCF:</text>
    <text x="235" y="903" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#047857">FILTER TWIST · FILTER STAB · FILTER ORBIT</text>

    <!-- Vertical Feeds Upward into Sources & Mixer -->
    <!-- Feed 1: Up to Sources (DCO/Sub) -->
    <line x1="190" y1="620" x2="190" y2="546" stroke="#7C3AED" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#arrow-purple)" />
    <!-- Feed 2: Up to Mixer/X-Mod -->
    <line x1="540" y1="620" x2="540" y2="546" stroke="#7C3AED" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#arrow-purple)" />
  </g>

  <!-- MOD CARD 2: VORTEX ENVELOPE (X = 730..1030) -->
  <g id="mod-vortex">
    <rect x="730" y="620" width="300" height="330" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="4" />
    <text x="750" y="675" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#065F46">VORTEX ENV</text>
    <text x="750" y="720" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#047857">4-STAGE FILTER CONTOUR</text>

    <text x="750" y="780" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#064E3B">• DEDICATED VCF CURVE</text>
    <text x="750" y="825" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#064E3B">• DUAL-48dB DAMPING</text>
    <text x="750" y="870" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#064E3B">• VARIABLE SKEW</text>
    <text x="750" y="915" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#059669">FAST OPTICAL EXP CURVE</text>

    <!-- Direct Vertical Feed Straight Up into Dual IR3R05 VCF -->
    <line x1="880" y1="620" x2="880" y2="546" stroke="#059669" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#arrow-green)" />
  </g>

  <!-- MOD CARD 3: CODYBASS DYNAMICS & LFO (X = 1090..1360) -->
  <g id="mod-codybass-lfo">
    <rect x="1090" y="620" width="270" height="330" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="4" />
    <text x="1110" y="675" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#991B1B">CODYBASS</text>
    <text x="1110" y="718" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#B91C1C">SUB DYNAMICS ENV</text>

    <text x="1110" y="765" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#7F1D1D">• INSTANT ATTACK</text>
    <text x="1110" y="805" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#7F1D1D">• SUB PUNCH MOD</text>

    <line x1="1110" y1="835" x2="1340" y2="835" stroke="#FEE2E2" stroke-width="3" />

    <text x="1110" y="880" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#991B1B">PITCH / LFO</text>
    <text x="1110" y="920" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#7F1D1D">• PITCH BEND &amp; GLIDE</text>

    <!-- Direct Vertical Feed Straight Up into Vactrol LPG / VCA -->
    <line x1="1225" y1="620" x2="1225" y2="546" stroke="#DC2626" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#arrow-red)" />
  </g>
</svg>
