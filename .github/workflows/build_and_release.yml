name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release to (e.g. v0.5.0)'
        required: true
        default: 'v0.5.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (Universal AU / VST3 / Standalone)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: tag
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building for release tag: $TAG"

      - name: Clone JUCE
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DTKS_BUILD_EXPERIMENTAL_TESTS=OFF

      - name: Build Plugins & Standalone
        run: |
          cmake --build build --config Release --parallel --target \
            Hastur_VST3 Hastur_AU Hastur_Standalone \
            FormlessSpawn_VST3 FormlessSpawn_AU FormlessSpawn_Standalone \
            DigiStrikeFS2_VST3 DigiStrikeFS2_AU DigiStrikeFS2_Standalone \
            Nyarlat_VST3 Nyarlat_AU Nyarlat_Standalone \
            dsp_tests

      - name: Run DSP Unit Tests
        run: |
          if [ -f "./build/dsp_tests" ]; then
            ./build/dsp_tests
          elif [ -f "./build/Release/dsp_tests" ]; then
            ./build/Release/dsp_tests
          fi

      - name: Package macOS Distribution Archives
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p dist_mac/hastur dist_mac/formless dist_mac/digistrike dist_mac/nyarlat dist_mac/suite

          # Copy Hastur bundles
          find build -name "Hastur.vst3" -type d -exec cp -R -P {} dist_mac/hastur/ \;
          find build -name "Hastur.component" -type d -exec cp -R -P {} dist_mac/hastur/ \;
          find build -name "Hastur.app" -type d -exec cp -R -P {} dist_mac/hastur/ \;

          # Copy Formless Spawn bundles
          find build -name "Formless Spawn.vst3" -type d -exec cp -R -P {} dist_mac/formless/ \;
          find build -name "Formless Spawn.component" -type d -exec cp -R -P {} dist_mac/formless/ \;
          find build -name "Formless Spawn.app" -type d -exec cp -R -P {} dist_mac/formless/ \;

          # Copy DigiStrike FS2 bundles
          find build -name "DigiStrike FS2.vst3" -type d -exec cp -R -P {} dist_mac/digistrike/ \;
          find build -name "DigiStrike FS2.component" -type d -exec cp -R -P {} dist_mac/digistrike/ \;
          find build -name "DigiStrike FS2.app" -type d -exec cp -R -P {} dist_mac/digistrike/ \;

          # Ensure ROM is in all DigiStrike bundles
          find dist_mac/digistrike -name "DigiStrike FS2.vst3" -o -name "DigiStrike FS2.component" -o -name "DigiStrike FS2.app" | while read -r item; do
            mkdir -p "$item/Contents/Resources"
            cp assets/digistrike_fs2_rom.bin "$item/Contents/Resources/" 2>/dev/null || true
          done

          # Copy Nyarlat bundles
          find build -name "Nyarlat.vst3" -type d -exec cp -R -P {} dist_mac/nyarlat/ \;
          find build -name "Nyarlat.component" -type d -exec cp -R -P {} dist_mac/nyarlat/ \;
          find build -name "Nyarlat.app" -type d -exec cp -R -P {} dist_mac/nyarlat/ \;

          # Ensure ROM is in all Nyarlat bundles
          find dist_mac/nyarlat -name "Nyarlat.vst3" -o -name "Nyarlat.component" -o -name "Nyarlat.app" | while read -r item; do
            mkdir -p "$item/Contents/Resources"
            cp assets/nyarlat_akwf_rom.bin "$item/Contents/Resources/" 2>/dev/null || true
          done

          # Ad-hoc codesign all binaries
          find dist_mac -name "*.vst3" -o -name "*.component" -o -name "*.app" | while read -r item; do
            codesign --force --deep -s - "$item" 2>/dev/null || true
          done

          # Assemble Suite bundle
          cp -R -P dist_mac/hastur/* dist_mac/suite/
          cp -R -P dist_mac/formless/* dist_mac/suite/
          cp -R -P dist_mac/digistrike/* dist_mac/suite/
          cp -R -P dist_mac/nyarlat/* dist_mac/suite/

          # Create zip archives (preserving symlinks)
          cd dist_mac/hastur && zip -r -y "../../Hastur-v1.3.0-macOS.zip" * && cd ../..
          cd dist_mac/formless && zip -r -y "../../Formless_Spawn-v1.3.0-macOS.zip" * && cd ../..
          cd dist_mac/digistrike && zip -r -y "../../DigiStrike_FS2-v1.2.0-macOS.zip" * && cd ../..
          cd dist_mac/nyarlat && zip -r -y "../../Nyarlat-v1.0.0-macOS.zip" * && cd ../..
          cd dist_mac/suite && zip -r -y "../../TheKlangSuite-${TAG}-macOS.zip" * && cd ../..

          ls -lh *-macOS.zip

      - name: Upload macOS Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            TheKlangSuite-*-macOS.zip
            Hastur-*-macOS.zip
            Formless_Spawn-*-macOS.zip
            DigiStrike_FS2-*-macOS.zip
            Nyarlat-*-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux x86_64 (VST3 / Standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: tag
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building for release tag: $TAG"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            zip

      - name: Clone JUCE
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTKS_BUILD_EXPERIMENTAL_TESTS=OFF

      - name: Build Plugins & Standalone
        run: |
          cmake --build build --config Release --parallel --target \
            Hastur_VST3 Hastur_Standalone \
            FormlessSpawn_VST3 FormlessSpawn_Standalone \
            DigiStrikeFS2_VST3 DigiStrikeFS2_Standalone \
            Nyarlat_VST3 Nyarlat_Standalone \
            dsp_tests

      - name: Run DSP Unit Tests
        run: |
          if [ -f "./build/dsp_tests" ]; then
            ./build/dsp_tests
          elif [ -f "./build/Release/dsp_tests" ]; then
            ./build/Release/dsp_tests
          fi

      - name: Package Linux Binaries
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p dist_linux/hastur dist_linux/formless dist_linux/digistrike dist_linux/nyarlat dist_linux/suite

          # Copy Hastur
          find build -name "Hastur.vst3" -type d -exec cp -R -P {} dist_linux/hastur/ \;
          find build -path "*Hastur_artefacts*Standalone/Hastur" -type f -exec cp {} dist_linux/hastur/ \;

          # Copy Formless Spawn
          find build -name "Formless Spawn.vst3" -type d -exec cp -R -P {} dist_linux/formless/ \;
          find build -path "*FormlessSpawn_artefacts*Standalone/Formless Spawn" -type f -exec cp {} dist_linux/formless/ \;

          # Copy DigiStrike FS2
          find build -name "DigiStrike FS2.vst3" -type d -exec cp -R -P {} dist_linux/digistrike/ \;
          find build -path "*DigiStrikeFS2_artefacts*Standalone/DigiStrike FS2" -type f -exec cp {} dist_linux/digistrike/ \;

          # Ensure ROM is in DigiStrike VST3
          find dist_linux/digistrike -name "DigiStrike FS2.vst3" | while read -r item; do
            mkdir -p "$item/Contents/Resources"
            cp assets/digistrike_fs2_rom.bin "$item/Contents/Resources/" 2>/dev/null || true
          done

          # Copy Nyarlat
          find build -name "Nyarlat.vst3" -type d -exec cp -R -P {} dist_linux/nyarlat/ \;
          find build -path "*Nyarlat_artefacts*Standalone/Nyarlat" -type f -exec cp {} dist_linux/nyarlat/ \;

          # Ensure ROM is in Nyarlat VST3
          find dist_linux/nyarlat -name "Nyarlat.vst3" | while read -r item; do
            mkdir -p "$item/Contents/Resources"
            cp assets/nyarlat_akwf_rom.bin "$item/Contents/Resources/" 2>/dev/null || true
          done

          # Assemble Suite
          cp -R -P dist_linux/hastur/* dist_linux/suite/
          cp -R -P dist_linux/formless/* dist_linux/suite/
          cp -R -P dist_linux/digistrike/* dist_linux/suite/
          cp -R -P dist_linux/nyarlat/* dist_linux/suite/

          # Create zip archives
          cd dist_linux/hastur && zip -r "../../Hastur-v1.3.0-Linux.zip" * && cd ../..
          cd dist_linux/formless && zip -r "../../Formless_Spawn-v1.3.0-Linux.zip" * && cd ../..
          cd dist_linux/digistrike && zip -r "../../DigiStrike_FS2-v1.2.0-Linux.zip" * && cd ../..
          cd dist_linux/nyarlat && zip -r "../../Nyarlat-v1.0.0-Linux.zip" * && cd ../..
          cd dist_linux/suite && zip -r "../../TheKlangSuite-${TAG}-Linux.zip" * && cd ../..

          ls -lh *-Linux.zip

      - name: Upload Linux Archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            TheKlangSuite-*-Linux.zip
            Hastur-*-Linux.zip
            Formless_Spawn-*-Linux.zip
            DigiStrike_FS2-*-Linux.zip
            Nyarlat-*-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64 (VST3 / Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: tag
        shell: pwsh
        run: |
          $TAG = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrEmpty($TAG)) {
            $TAG = "${{ github.ref_name }}"
          }
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          Write-Host "Building for release tag: $TAG"

      - name: Clone JUCE
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTKS_BUILD_EXPERIMENTAL_TESTS=OFF

      - name: Build Plugins & Standalone
        run: |
          cmake --build build --config Release --parallel --target `
            Hastur_VST3 Hastur_Standalone `
            FormlessSpawn_VST3 FormlessSpawn_Standalone `
            DigiStrikeFS2_VST3 DigiStrikeFS2_Standalone `
            Nyarlat_VST3 Nyarlat_Standalone `
            dsp_tests

      - name: Run DSP Unit Tests
        run: .\build\Release\dsp_tests.exe

      - name: Package Windows Binaries
        shell: pwsh
        run: |
          $TAG = "${{ steps.tag.outputs.tag }}"
          New-Item -ItemType Directory -Path dist_win/hastur, dist_win/formless, dist_win/digistrike, dist_win/nyarlat, dist_win/suite -Force

          # Hastur
          $hasturVst3 = (Get-ChildItem -Path "build/Hastur_artefacts" -Filter "Hastur.vst3" -Recurse -Directory | Select-Object -First 1).FullName
          $hasturExe = (Get-ChildItem -Path "build/Hastur_artefacts" -Filter "Hastur.exe" -Recurse -File | Select-Object -First 1).FullName
          Copy-Item -Recurse $hasturVst3 dist_win/hastur/
          Copy-Item $hasturExe dist_win/hastur/

          # Formless Spawn
          $formlessVst3 = (Get-ChildItem -Path "build/FormlessSpawn_artefacts" -Filter "Formless Spawn.vst3" -Recurse -Directory | Select-Object -First 1).FullName
          $formlessExe = (Get-ChildItem -Path "build/FormlessSpawn_artefacts" -Filter "Formless Spawn.exe" -Recurse -File | Select-Object -First 1).FullName
          Copy-Item -Recurse $formlessVst3 dist_win/formless/
          Copy-Item $formlessExe dist_win/formless/

          # DigiStrike FS2
          $digistrikeVst3 = (Get-ChildItem -Path "build/DigiStrikeFS2_artefacts" -Filter "DigiStrike FS2.vst3" -Recurse -Directory | Select-Object -First 1).FullName
          $digistrikeExe = (Get-ChildItem -Path "build/DigiStrikeFS2_artefacts" -Filter "DigiStrike FS2.exe" -Recurse -File | Select-Object -First 1).FullName
          Copy-Item -Recurse $digistrikeVst3 dist_win/digistrike/
          Copy-Item $digistrikeExe dist_win/digistrike/

          # Ensure ROM in DigiStrike VST3
          New-Item -ItemType Directory -Path "dist_win/digistrike/DigiStrike FS2.vst3/Contents/Resources" -Force
          Copy-Item "assets/digistrike_fs2_rom.bin" "dist_win/digistrike/DigiStrike FS2.vst3/Contents/Resources/" -Force

          # Nyarlat
          $nyarlatVst3 = (Get-ChildItem -Path "build/Nyarlat_artefacts" -Filter "Nyarlat.vst3" -Recurse -Directory | Select-Object -First 1).FullName
          $nyarlatExe = (Get-ChildItem -Path "build/Nyarlat_artefacts" -Filter "Nyarlat.exe" -Recurse -File | Select-Object -First 1).FullName
          Copy-Item -Recurse $nyarlatVst3 dist_win/nyarlat/
          Copy-Item $nyarlatExe dist_win/nyarlat/

          # Ensure ROM in Nyarlat VST3
          New-Item -ItemType Directory -Path "dist_win/nyarlat/Nyarlat.vst3/Contents/Resources" -Force
          Copy-Item "assets/nyarlat_akwf_rom.bin" "dist_win/nyarlat/Nyarlat.vst3/Contents/Resources/" -Force

          # Suite
          Copy-Item -Recurse dist_win/hastur/* dist_win/suite/
          Copy-Item -Recurse dist_win/formless/* dist_win/suite/
          Copy-Item -Recurse dist_win/digistrike/* dist_win/suite/
          Copy-Item -Recurse dist_win/nyarlat/* dist_win/suite/

          # Compress
          Compress-Archive -Path dist_win/hastur/* -DestinationPath "Hastur-v1.3.0-Windows.zip" -Force
          Compress-Archive -Path dist_win/formless/* -DestinationPath "Formless_Spawn-v1.3.0-Windows.zip" -Force
          Compress-Archive -Path dist_win/digistrike/* -DestinationPath "DigiStrike_FS2-v1.2.0-Windows.zip" -Force
          Compress-Archive -Path dist_win/nyarlat/* -DestinationPath "Nyarlat-v1.0.0-Windows.zip" -Force
          Compress-Archive -Path dist_win/suite/* -DestinationPath "TheKlangSuite-$TAG-Windows.zip" -Force

          Get-ChildItem *-Windows.zip

      - name: Upload Windows Archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            TheKlangSuite-*-Windows.zip
            Hastur-*-Windows.zip
            Formless_Spawn-*-Windows.zip
            DigiStrike_FS2-*-Windows.zip
            Nyarlat-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
