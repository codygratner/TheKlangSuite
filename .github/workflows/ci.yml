name: Multi-Platform CI & Plugin Host Validation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-Flight Cross-Platform & Audio Safety
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cross-Platform & Platform Airlock Linter
        run: python3 tools/compat_check.py --strict --root .

      - name: Run Audio-Thread Safety Linter
        run: python3 tools/audit_audiothread.py --strict

  test-macos:
    name: macOS (AU / VST3 / Unit Tests / auval / pluginval)
    needs: preflight
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE 9.0.3
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build DSP Tests (Test-First)
        run: cmake --build build --config Release --parallel --target dsp_tests

      - name: Run DSP Unit Tests
        run: |
          if [ -f "./build/dsp_tests" ]; then
            ./build/dsp_tests
          elif [ -f "./build/Release/dsp_tests" ]; then
            ./build/Release/dsp_tests
          fi

      - name: Build Plugins (Cracked Chimes Fleet)
        run: |
          cmake --build build --config Release --parallel --target \
            Hastur_VST3 Hastur_AU \
            FormlessSpawn_VST3 FormlessSpawn_AU \
            DigiStrikeFS2_VST3 DigiStrikeFS2_AU \
            Nyarlat_VST3 Nyarlat_AU

      - name: Codesign macOS Plugins (Ad-hoc)
        run: |
          find build -name "*.vst3" -o -name "*.component" | while read -r item; do
            codesign --force --deep -s - "$item"
          done

      - name: Install & Run Native auval Test
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          find build -name "*.component" -exec cp -R -P {} "$HOME/Library/Audio/Plug-Ins/Components/" \;
          killall -9 coreaudiod 2>/dev/null || true
          sleep 2
          echo "Running auval on Hastur..."
          auval -v aumu Hst1 CkCh || true
          echo "Running auval on Formless Spawn..."
          auval -v aumu Tfsp CkCh || true
          echo "Running auval on DigiStrike FS2..."
          auval -v aumu Dfs2 CkCh || true
          echo "Running auval on Nyarlat..."
          auval -v aumu Nyrt CkCh || true

      - name: Download & Run Tracktion pluginval
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval
          for p in "Hastur.vst3" "Formless Spawn.vst3" "DigiStrike FS2.vst3" "Nyarlat.vst3"; do
            TARGET=$(find build -name "$p" | head -n 1)
            echo "Validating $TARGET with pluginval..."
            pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 60000 "$TARGET"
          done

  test-linux:
    name: Linux x86_64 (VST3 / Unit Tests / Xvfb / pluginval)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            xvfb \
            fluxbox \
            curl \
            unzip

      - name: Clone JUCE 9.0.3
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP Tests (Test-First Fail-Fast)
        run: cmake --build build --config Release --parallel --target dsp_tests

      - name: Run DSP Unit Tests
        run: |
          if [ -f "./build/dsp_tests" ]; then
            ./build/dsp_tests
          elif [ -f "./build/Release/dsp_tests" ]; then
            ./build/Release/dsp_tests
          fi

      - name: Build Plugins (Cracked Chimes Fleet)
        run: |
          cmake --build build --config Release --parallel --target \
            Hastur_VST3 FormlessSpawn_VST3 DigiStrikeFS2_VST3 Nyarlat_VST3

      - name: Download & Run Tracktion pluginval
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          chmod +x pluginval
          for p in "Hastur.vst3" "Formless Spawn.vst3" "DigiStrike FS2.vst3" "Nyarlat.vst3"; do
            TARGET=$(find build -name "$p" | head -n 1)
            echo "Validating $TARGET under Xvfb..."
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
              sh -c "fluxbox & sleep 1; ./pluginval --strictness-level 5 --validate-in-process --timeout-ms 60000 \"$TARGET\""
          done

  test-windows:
    name: Windows x64 (VST3 / Unit Tests / pluginval)
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE 9.0.3
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP Tests (Test-First)
        run: cmake --build build --config Release --parallel --target dsp_tests

      - name: Run DSP Unit Tests
        run: .\build\Release\dsp_tests.exe

      - name: Build Plugins (Cracked Chimes Fleet)
        run: |
          cmake --build build --config Release --parallel --target `
            Hastur_VST3 FormlessSpawn_VST3 DigiStrikeFS2_VST3 Nyarlat_VST3

      - name: Download & Run Tracktion pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile "pluginval.zip"
          Expand-Archive -Path "pluginval.zip" -DestinationPath "."
          $targets = @("Hastur.vst3", "Formless Spawn.vst3", "DigiStrike FS2.vst3", "Nyarlat.vst3")
          foreach ($t in $targets) {
            $p = (Get-ChildItem -Path build -Filter $t -Recurse | Select-Object -First 1).FullName
            echo "Validating $p with pluginval..."
            .\pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 60000 "$p"
          }
