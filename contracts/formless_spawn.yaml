plugin: formless_spawn
name: Formless Spawn Sovereign Drum Voice
version: 2.4.0
manufacturer: The Cult of Klang

parameters:
  # ==============================================================================
  # HEADER CONTROLS (3 selectors)
  # ==============================================================================
  - id: role
    name: Drum Role
    short: ROLE
    category: header
    type: choice
    choices: [BD, SD, TM, CP, HH, CY, PC, FX]
    default: 0

  - id: model
    name: Synthesis Model
    short: MODEL
    category: header
    type: choice
    choices: ["00", "01", "02", "03", "04", "05", "06", "07"]
    default: 0

  - id: life_mode
    name: Lifeform Character
    short: TRIAD
    category: header
    type: choice
    choices: [Synthetic, Cyborg, Organic]
    default: 2

  # ==============================================================================
  # CARD 1: MASTER MACRO & DYNAMICS LAB (8 parameters - Top-Left)
  # ==============================================================================
  - id: macro_x
    name: Macro X (Pitch)
    short: MACRO-X
    category: macro
    type: float
    effect: pitch
    range: [0.0, 1.0]
    default: 0.5

  - id: macro_y
    name: Macro Y (Punch)
    short: MACRO-Y
    category: macro
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  - id: macro_z
    name: Macro Z (Timbre)
    short: MACRO-Z
    category: macro
    type: float
    effect: timbre
    range: [0.0, 1.0]
    default: 0.5

  - id: macro_t
    name: Macro T (Time)
    short: MACRO-T
    category: macro
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  - id: vel_aggr
    name: Vel To Aggression
    short: VEL-AGGR
    category: dynamics
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  - id: vel_timb
    name: Vel To Timbre
    short: VEL-TIMB
    category: dynamics
    type: float
    effect: timbre
    range: [0.0, 1.0]
    default: 0.5

  - id: pan
    name: Voice Pan
    short: PAN
    category: output
    type: float
    effect: output
    range: [-1.0, 1.0]
    default: 0.0

  - id: decay_curve
    name: Decay Curve
    short: DECAY-CRV
    category: dynamics
    type: float
    effect: dynamics
    range: [-1.0, 1.0]
    default: -0.5

  # ==============================================================================
  # CARD 2: ROLE SYNTHESIS LAB (8 parameters - Top-Right)
  # ==============================================================================
  - id: param_a
    name: Role Param A
    short: PARAM-A
    category: synthesis
    type: float
    effect: pitch
    range: [0.0, 1.0]
    default: 0.5

  - id: param_b
    name: Role Param B
    short: PARAM-B
    category: synthesis
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  - id: param_c
    name: Role Param C
    short: PARAM-C
    category: synthesis
    type: float
    effect: pitch
    range: [0.0, 1.0]
    default: 0.5

  - id: param_d
    name: Role Param D
    short: PARAM-D
    category: synthesis
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  - id: param_e
    name: Role Param E
    short: PARAM-E
    category: synthesis
    type: float
    effect: timbre
    range: [0.0, 1.0]
    default: 0.5

  - id: param_f
    name: Role Param F
    short: PARAM-F
    category: synthesis
    type: float
    effect: timbre
    range: [0.0, 1.0]
    default: 0.5

  - id: param_g
    name: Role Param G
    short: PARAM-G
    category: synthesis
    type: float
    effect: timbre
    range: [0.0, 1.0]
    default: 0.5

  - id: param_h
    name: Role Param H
    short: PARAM-H
    category: synthesis
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  # ==============================================================================
  # CARD 3: PERFORMANCE ALTAR & MOJO CONSOLE (18 parameters - Bottom)
  # ==============================================================================
  # Left Pod: Stepped Random Humanization (2x4 Grid of 8 Small Knobs)
  # Row 1: Macro Targets
  - id: rand_x
    name: Rand Macro X
    short: R-X
    category: random
    type: float
    effect: pitch
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  - id: rand_y
    name: Rand Macro Y
    short: R-Y
    category: random
    type: float
    effect: dynamics
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  - id: rand_z
    name: Rand Macro Z
    short: R-Z
    category: random
    type: float
    effect: timbre
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  - id: rand_t
    name: Rand Macro T
    short: R-T
    category: random
    type: float
    effect: dynamics
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  # Row 2: Dynamics & Altar Targets
  - id: rand_aggr
    name: Rand Aggression
    short: R-AGGR
    category: random
    type: float
    effect: dynamics
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  - id: rand_timb
    name: Rand Timbre
    short: R-TIMB
    category: random
    type: float
    effect: timbre
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  - id: rand_pan
    name: Rand Pan
    short: R-PAN
    category: random
    type: float
    effect: output
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  - id: rand_decay
    name: Rand Macro Decay
    short: R-DECAY
    category: random
    type: float
    effect: dynamics
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0

  # Center Altar: The Master Macro & Master Out (2 controls)
  - id: macro_decay
    name: Macro Decay
    short: MACRO
    category: performance
    type: float
    effect: dynamics
    range: [0.0, 1.0]
    default: 0.5

  - id: volume
    name: Master Volume
    short: VOLUME
    category: output
    type: float
    effect: output
    range: [0.0, 1.0]
    default: 0.85

  # Right Pod: VCF & Universal Hardware Mojo Strip (9 controls)
  - id: cutoff
    name: Filter Cutoff
    short: CUTOFF
    category: filter
    type: float
    effect: filter
    range: [20.0, 20000.0]
    skew_mid: 1000.0
    unit: Hz
    default: 2000.0

  - id: resonance
    name: Filter Resonance
    short: RES
    category: filter
    type: float
    effect: filter
    range: [0.0, 1.0]
    default: 0.3

  - id: filter_type
    name: Filter Type
    short: TYPE
    category: filter
    type: choice
    choices: [LP, HP, BP, BR]
    default: 0

  - id: pre_drive
    name: Pre-Filter Drive
    short: DRIVE
    category: drive
    type: float
    effect: saturation
    range: [0.0, 1.0]
    default: 0.15

  - id: crush
    name: Mojo Sample Crush
    short: CRUSH
    category: mojo
    type: float
    effect: timbre
    range: [1000.0, 48000.0]
    skew_mid: 8000.0
    unit: Hz
    default: 48000.0

  - id: bits
    name: Mojo Bit Reduction
    short: BITS
    category: mojo
    type: float
    effect: timbre
    range: [4.0, 16.0]
    unit: bits
    default: 16.0

  - id: tape_glue
    name: Mojo Tape Glue
    short: TAPE
    category: mojo
    type: float
    effect: saturation
    range: [0.0, 1.0]
    default: 0.0

  - id: mojo_profile
    name: Mojo Profile
    short: PROFILE
    category: mojo
    type: choice
    choices: [Clean, MD-12, SP-1200, Iron Tape]
    default: 0
